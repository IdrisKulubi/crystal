experiment_id: E20
name: dapt_w2v2_probe
parent_run: E05__wav2vec2_base_probe__20261116-234352__2df0f80
change_vs_parent: encoder weights from DAPT run D01 (wav2vec2-base self-supervised
  pretraining continued on CryCeleb) instead of the released wav2vec2-base
paper:
  table: T3
  row: DAPT wav2vec2, linear probe
task: reason
data:
  metadata: data/metadata_folds.csv
  base_metadata: data/metadata.csv
  datasets:
  - donateacry
  label_set: donateacry_v1
  sample_rate: 16000
  clip_seconds: 7.0
model:
  type: linear_probe
  backbone: null
  init_checkpoint: dapt:D01
  head: mean_pool
  peft: null
  context_features: []
  encoder: wav2vec2_base
  layer: last
  grid_C:
  - 0.001
  - 0.01
  - 0.1
  - 1
  - 10
train:
  epochs: 15
  batch_size: 8
  grad_accum: 4
  lr: 3.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  loss: weighted_ce
  focal_gamma: 2.0
  augment:
    noise_snr_db: null
    specaugment: false
    mixup_alpha: null
    pitch_shift: false
  sampler: shuffle
  early_stopping_metric: val_macro_f1
  patience: 5
eval:
  folds:
  - 0
  - 1
  - 2
  - 3
  - 4
  seeds:
  - 0
  - 1
  - 2
  val_group_fraction: 0.15
notes: Same as E05 except the encoder weights. dapt:D01 resolves to the latest completed
  D01 checkpoint (src/dapt.py).
