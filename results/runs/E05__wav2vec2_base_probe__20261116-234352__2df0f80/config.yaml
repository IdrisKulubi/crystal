experiment_id: E05
name: wav2vec2_base_probe
parent_run: null
change_vs_parent: null
paper:
  table: T3
  row: wav2vec2-base, linear probe
task: reason
data:
  metadata: data/metadata_folds.csv
  base_metadata: data/metadata.csv
  datasets:
  - donateacry
  label_set: donateacry_v1
  sample_rate: 16000
  clip_seconds: 7.0
model:
  type: linear_probe
  backbone: null
  init_checkpoint: null
  head: mean_pool
  peft: null
  context_features: []
  encoder: wav2vec2_base
  layer: last
  grid_C:
  - 0.001
  - 0.01
  - 0.1
  - 1
  - 10
train:
  epochs: 15
  batch_size: 8
  grad_accum: 4
  lr: 3.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  loss: weighted_ce
  focal_gamma: 2.0
  augment:
    noise_snr_db: null
    specaugment: false
    mixup_alpha: null
    pitch_shift: false
  early_stopping_metric: val_macro_f1
  patience: 5
eval:
  folds:
  - 0
  - 1
  - 2
  - 3
  - 4
  seeds:
  - 0
  - 1
  - 2
  val_group_fraction: 0.15
notes: Frozen encoder, last layer pooled (see src/models/encoders.py), StandardScaler
  + LogisticRegression(class_weight=balanced); C chosen on val macro-F1. Deterministic
  given the fold, so the 3 seeds give identical results.
