experiment_id: E90-ours
name: leak_randomsplit_ours
parent_run: E36
change_vs_parent: random clip-level split (data/metadata_randomsplit.csv; babies shared
  between train and test) instead of the grouped folds
paper:
  table: T4
  row: Ours, random clip-level split
data:
  label_set: donateacry_v1
  metadata: data/metadata_randomsplit.csv
model:
  type: finetune
  backbone: ast
  head: attention
  peft: null
  context_features:
  - age_bracket
  - gender
train:
  lr: 3.0e-05
  loss: focal
  focal_gamma: 2.0
  augment:
    noise_snr_db:
    - 0
    - 20
    noise_prob: 0.5
    specaugment:
      freq_mask: 24
      time_mask: 96
      n_masks: 1
    mixup_alpha: 0.4
notes: 'Phase 8 leakage demo ONLY: deliberately leaky split to measure score inflation.
  Never used for model choice.'
